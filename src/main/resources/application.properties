# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server.port=${PORT:8080}

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL - SUPABASE)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading_journal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANTE: Cambiado a 'update' para que cree las tablas la primera vez en la nube
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ===============================
application.security.jwt.secret-key=${JWT_SECRET:UnaClaveSecretaMuyLargaYSeguraParaDesarrolloLocal12345!}
application.security.jwt.expiration=86400000

# ===============================
# Google OAuth2
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:62700038720-n3ght1f3hn93o39n9870undo3h3004dc.apps.googleusercontent.com}

# ===============================
# ===============================
# LEMON SQUEEZY (Suscripciones Seguras)
# ===============================
lemonsqueezy.api.key=${LEMON_API_KEY:tu_api_key_aqui}
lemonsqueezy.store.id=${LEMON_STORE_ID:tu_id_de_tienda}
lemonsqueezy.variant.pro.id=${LEMON_VARIANT_PRO_ID:tu_id_del_producto_pro}
lemonsqueezy.webhook.secret=${LEMON_WEBHOOK_SECRET:un_secreto_largo_y_seguro}
lemonsqueezy.redirect.url=${LEMON_REDIRECT_URL:http://localhost:5173/dashboard?session_id=success}
# ===============================
# CONFIGURACIÓN DE ALMACENAMIENTO (Temporal)
# ===============================
file.upload-dir=/tmp/uploads/trades
# ===============================

# --- MITIGACIÓN DDoS CAPA 7 (TIMEOUTS) ---
# Si una petición HTTP tarda más de 20 segundos, Tomcat la corta
server.tomcat.connection-timeout=20000
# Si la base de datos no responde en 20 segundos, aborta la consulta
spring.datasource.hikari.connection-timeout=20000
# Evita que se abran infinitas conexiones a la BD simultáneamente
spring.datasource.hikari.maximum-pool-size=20

